<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortLab — 排序算法可视化</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121722;
    --line: #1f2633;
    --fg: #e6edf3;
    --dim: #8b949e;
    --accent: #58a6ff;
    --warm: #f0b429;
    --good: #3fb950;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 18px 24px 10px;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: .3px;
  }
  header .sub { color: var(--dim); font-size: 12px; }
  header .algo {
    margin-left: auto;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 0 24px 20px;
    min-height: 0;
  }

  .stage {
    position: relative;
    flex: 1;
    min-height: 220px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 14px 10px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    width: 100%;
    height: 100%;
  }
  .bar {
    flex: 1 1 0;
    min-width: 1px;
    border-radius: 2px 2px 0 0;
    background: hsl(calc(205 + var(--v) * 0.55) 72% 55%);
    transition: height .06s linear, background-color .12s linear;
  }
  .bar.cmp {
    background: var(--warm);
    box-shadow: 0 0 0 1px rgba(240, 180, 41, .55);
  }
  .bar.done { background: var(--good); }

  .banner {
    position: absolute;
    inset: auto 14px 12px auto;
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(63, 185, 80, .12);
    border: 1px solid rgba(63, 185, 80, .35);
    color: #7ee787;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .banner.show { display: flex; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .field { display: flex; align-items: center; gap: 8px; }
  .field label { color: var(--dim); font-size: 12px; white-space: nowrap; }
  select, input[type="range"] { accent-color: var(--accent); }
  select {
    background: #0f1420;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
  }
  input[type="range"] { width: 110px; }

  .buttons { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  button {
    font: inherit;
    color: var(--fg);
    background: #182030;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover:not(:disabled) { background: #1f2a3d; border-color: #2d3b52; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary {
    background: rgba(88, 166, 255, .14);
    border-color: rgba(88, 166, 255, .45);
    color: #a5d6ff;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 14px;
  }
  .stat dt { color: var(--dim); font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
  .stat dd {
    margin: 2px 0 0;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  @media (max-width: 860px) {
    header { padding: 14px 16px 8px; }
    main { padding: 0 16px 14px; gap: 10px; }
    .buttons { margin-left: 0; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stage { min-height: 180px; }
  }
  @media (max-height: 640px) {
    .stage { min-height: 150px; }
    header h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>SortLab</h1>
  <span class="sub">排序算法可视化 · 离线单文件</span>
  <span class="algo" id="algoName">冒泡排序</span>
</header>

<main>
  <section class="stage" aria-label="排序动画舞台">
    <div class="bars" id="bars"></div>
    <div class="banner" id="banner">
      <span>已完成</span>
      <span id="bannerStats">—</span>
    </div>
  </section>

  <section class="controls" aria-label="控制面板">
    <div class="field">
      <label for="algo">算法</label>
      <select id="algo">
        <option value="bubble">冒泡排序</option>
        <option value="insertion">插入排序</option>
        <option value="quick">快速排序</option>
        <option value="merge">归并排序</option>
      </select>
    </div>
    <div class="field">
      <label for="size">规模 <output id="sizeOut">60</output></label>
      <input id="size" type="range" min="20" max="200" step="10" value="60">
    </div>
    <div class="field">
      <label for="speed">速度 <output id="speedOut">12</output>×</label>
      <input id="speed" type="range" min="1" max="60" step="1" value="12">
    </div>
    <div class="buttons">
      <button id="play" class="primary">开始</button>
      <button id="step">单步</button>
      <button id="reset">重置</button>
    </div>
  </section>

  <section class="stats" aria-label="统计">
    <dl class="stat"><dt>比较</dt><dd id="cmp">0</dd></dl>
    <dl class="stat"><dt>写入</dt><dd id="wr">0</dd></dl>
    <dl class="stat"><dt>步数</dt><dd id="steps">0</dd></dl>
    <dl class="stat"><dt>用时</dt><dd id="elapsed">0.00s</dd></dl>
  </section>
</main>

<script id="sort-core">
const SortCore = (() => {
  "use strict";

  function lcg(seed) {
    let s = seed >>> 0;
    return function () {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function generate(n, seed) {
    const rand = lcg(seed === undefined ? 20261020 : seed);
    const out = new Array(n);
    for (let i = 0; i < n; i++) out[i] = 1 + Math.floor(rand() * 99);
    return out;
  }

  function makeRecorder() {
    const frames = [];
    let comparisons = 0;
    let writes = 0;
    return {
      frames,
      compare(i, j) {
        comparisons++;
        frames.push({ t: "c", i, j });
      },
      write(i, v) {
        writes++;
        frames.push({ t: "w", i, v });
      },
      stats() {
        return { comparisons, writes };
      },
    };
  }

  function swap(a, i, j, rec) {
    const t = a[i];
    a[i] = a[j];
    a[j] = t;
    rec.write(i, a[i]);
    rec.write(j, a[j]);
  }

  function bubble(input) {
    const a = input.slice();
    const rec = makeRecorder();
    for (let end = a.length; end > 1; end--) {
      let swapped = false;
      for (let i = 0; i < end - 1; i++) {
        rec.compare(i, i + 1);
        if (a[i] > a[i + 1]) {
          swap(a, i, i + 1, rec);
          swapped = true;
        }
      }
      if (!swapped) break;
    }
    return Object.assign({ sorted: a, frames: rec.frames }, rec.stats());
  }

  function insertion(input) {
    const a = input.slice();
    const rec = makeRecorder();
    for (let i = 1; i < a.length; i++) {
      const key = a[i];
      let j = i - 1;
      while (j >= 0) {
        rec.compare(j, j + 1);
        if (a[j] <= key) break;
        rec.write(j + 1, a[j]);
        a[j + 1] = a[j];
        j--;
      }
      if (j + 1 !== i) {
        rec.write(j + 1, key);
        a[j + 1] = key;
      }
    }
    return Object.assign({ sorted: a, frames: rec.frames }, rec.stats());
  }

  function quick(input) {
    const a = input.slice();
    const rec = makeRecorder();

    function partition(lo, hi) {
      const pivot = a[hi];
      let i = lo;
      for (let j = lo; j < hi; j++) {
        rec.compare(j, hi);
        if (a[j] <= pivot) {
          if (i !== j) swap(a, i, j, rec);
          i++;
        }
      }
      if (i !== hi) swap(a, i, hi, rec);
      return i;
    }

    const stack = [[0, a.length - 1]];
    while (stack.length) {
      const [lo, hi] = stack.pop();
      if (lo >= hi) continue;
      const p = partition(lo, hi);
      if (p - 1 > lo) stack.push([lo, p - 1]);
      if (p + 1 < hi) stack.push([p + 1, hi]);
    }
    return Object.assign({ sorted: a, frames: rec.frames }, rec.stats());
  }

  function merge(input) {
    const a = input.slice();
    const rec = makeRecorder();
    const buf = new Array(a.length);

    function sort(lo, hi) {
      if (hi - lo < 1) return;
      const mid = (lo + hi) >> 1;
      sort(lo, mid);
      sort(mid + 1, hi);
      let i = lo;
      let j = mid + 1;
      let k = lo;
      while (i <= mid && j <= hi) {
        rec.compare(i, j);
        if (a[i] <= a[j]) buf[k++] = a[i++];
        else buf[k++] = a[j++];
      }
      while (i <= mid) buf[k++] = a[i++];
      while (j <= hi) buf[k++] = a[j++];
      for (let x = lo; x <= hi; x++) {
        if (a[x] !== buf[x]) {
          a[x] = buf[x];
          rec.write(x, buf[x]);
        }
      }
    }

    sort(0, a.length - 1);
    return Object.assign({ sorted: a, frames: rec.frames }, rec.stats());
  }

  return {
    bubble,
    insertion,
    quick,
    merge,
    generate,
    algorithms: ["bubble", "insertion", "quick", "merge"],
    labels: {
      bubble: "冒泡排序",
      insertion: "插入排序",
      quick: "快速排序",
      merge: "归并排序",
    },
  };
})();
</script>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const els = {
    bars: $("bars"),
    banner: $("banner"),
    bannerStats: $("bannerStats"),
    algo: $("algo"),
    algoName: $("algoName"),
    size: $("size"),
    sizeOut: $("sizeOut"),
    speed: $("speed"),
    speedOut: $("speedOut"),
    play: $("play"),
    step: $("step"),
    reset: $("reset"),
    cmp: $("cmp"),
    wr: $("wr"),
    steps: $("steps"),
    elapsed: $("elapsed"),
  };

  const state = {
    values: [],
    working: [],
    frames: [],
    cursor: 0,
    playing: false,
    compared: [],
    comparisons: 0,
    writes: 0,
    startedAt: 0,
    finished: false,
    raf: 0,
  };

  const size = () => Number(els.size.value);
  const speed = () => Number(els.speed.value);

  function makeBar(value, max) {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = Math.max(2, (value / max) * 100) + "%";
    bar.style.setProperty("--v", value);
    bar.title = String(value);
    return bar;
  }

  function render() {
    const max = Math.max.apply(null, state.working.length ? state.working : [1]);
    const frag = document.createDocumentFragment();
    for (let i = 0; i < state.working.length; i++) {
      const bar = makeBar(state.working[i], max);
      if (state.compared.indexOf(i) !== -1) bar.classList.add("cmp");
      else if (state.finished) bar.classList.add("done");
      frag.appendChild(bar);
    }
    els.bars.replaceChildren(frag);
  }

  function resetValues() {
    cancelAnimationFrame(state.raf);
    state.playing = false;
    state.finished = false;
    state.frames = [];
    state.cursor = 0;
    state.compared = [];
    state.comparisons = 0;
    state.writes = 0;
    state.values = SortCore.generate(size());
    state.working = state.values.slice();
    els.play.textContent = "开始";
    els.step.disabled = false;
    els.banner.classList.remove("show");
    els.cmp.textContent = "0";
    els.wr.textContent = "0";
    els.steps.textContent = "0";
    els.elapsed.textContent = "0.00s";
    render();
  }

  function prepare() {
    if (state.frames.length) return;
    const fn = SortCore[els.algo.value];
    const run = fn(state.values);
    state.frames = run.frames;
    state.expected = run;
    state.startedAt = performance.now();
  }

  function applyFrame(frame) {
    if (frame.t === "c") {
      state.comparisons++;
      state.compared = [frame.i, frame.j];
    } else {
      state.working[frame.i] = frame.v;
      state.writes++;
      state.compared = [frame.i];
    }
  }

  function tick() {
    if (!state.playing && state.cursor > 0 && state.cursor < state.frames.length) {
      // paused: keep frame visible
    }
    if (state.cursor >= state.frames.length) {
      finish();
      return;
    }
    const n = state.playing ? speed() : 1;
    for (let k = 0; k < n && state.cursor < state.frames.length; k++) {
      applyFrame(state.frames[state.cursor++]);
    }
    render();
    els.cmp.textContent = String(state.comparisons);
    els.wr.textContent = String(state.writes);
    els.steps.textContent = String(state.cursor);
    els.elapsed.textContent = ((performance.now() - state.startedAt) / 1000).toFixed(2) + "s";
    if (state.cursor >= state.frames.length) {
      finish();
      return;
    }
    if (state.playing) state.raf = requestAnimationFrame(tick);
  }

  function finish() {
    state.playing = false;
    state.finished = true;
    state.working = state.values.slice().sort((a, b) => a - b);
    state.compared = [];
    render();
    const secs = ((performance.now() - state.startedAt) / 1000).toFixed(2);
    els.elapsed.textContent = secs + "s";
    els.bannerStats.textContent = `${state.comparisons} 次比较 / ${state.writes} 次写入 / ${secs}s`;
    els.banner.classList.add("show");
    els.play.textContent = "重新开始";
    els.play.disabled = false;
    els.step.disabled = true;
  }

  function play() {
    if (state.finished) {
      resetValues();
      return;
    }
    if (state.playing) {
      state.playing = false;
      els.play.textContent = "继续";
      return;
    }
    prepare();
    state.playing = true;
    els.play.textContent = "暂停";
    state.raf = requestAnimationFrame(tick);
  }

  function stepOnce() {
    if (state.finished) return;
    prepare();
    state.playing = false;
    tick();
    els.play.textContent = "继续";
  }

  els.play.addEventListener("click", play);
  els.step.addEventListener("click", stepOnce);
  els.reset.addEventListener("click", resetValues);
  els.algo.addEventListener("change", () => {
    els.algoName.textContent = SortCore.labels[els.algo.value];
    resetValues();
  });
  els.size.addEventListener("input", () => {
    els.sizeOut.textContent = els.size.value;
    resetValues();
  });
  els.speed.addEventListener("input", () => {
    els.speedOut.textContent = els.speed.value;
  });

  resetValues();
})();
</script>
</body>
</html>
